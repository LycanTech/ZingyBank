# ZingyBank — Enterprise Azure DevOps CI/CD Pipeline
#
# Branch Strategy:
#   dev     → CI + Security Scan + Docker Build → Deploy to Dev (auto)
#   staging → CI + Security Scan + Docker Build → Deploy to Staging (auto)
#   main    → CI + Security Scan + Docker Build → Deploy to Staging (auto)
#                                               → Deploy to Production (APPROVAL REQUIRED)
#
# ─────────────────────────────────────────────────────────────────────────────
# Azure DevOps Setup (one-time, manual):
#
# 1. Environments (Pipelines → Environments → New):
#    • zingybank-dev        — no checks needed (auto-deploy)
#    • zingybank-staging    — optional: add approvals for staging promotion
#    • zingybank-production — ADD Approvals & Checks → Approvals → your team
#      Recommended settings: timeout 1 day, notify on pending, reject on timeout
#
# 2. Service Connections (Project Settings → Service connections):
#    • azure-service-connection  — Azure Resource Manager, subscription scope
#    • azure-acr-service-connection — Docker Registry → Azure Container Registry
#
# 3. Variable Groups (Pipelines → Library → Variable groups):
#    • zingybank-dev-vars     — AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
#    • zingybank-staging-vars — AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
#    • zingybank-prod-vars    — AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
#
#    (All three may point to the same AKS cluster initially, each with
#     the appropriate resource group and cluster name for that environment.)
# ─────────────────────────────────────────────────────────────────────────────

trigger:
  branches:
    include:
      - main
      - staging
      - dev
  paths:
    exclude:
      - '*.md'
      - 'docs/**'
      - '.github/**'

pr:
  branches:
    include:
      - main
      - staging
      - dev

variables:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  REGISTRY_ACR: 'zingybank.azurecr.io'
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository

# ════════════════════════════════════════════════════════════════════════════
# Stage 1 — Build & Test
# Runs on every push and PR to dev / staging / main
# ════════════════════════════════════════════════════════════════════════════
stages:

- stage: CI_Build
  displayName: '1 · Build & Test'
  jobs:

  # ── Java microservices (11 services, up to 6 parallel) ───────────────────
  - job: BuildTestServices
    displayName: 'Build & Test — $(SERVICE)'
    pool:
      vmImage: ubuntu-latest
    strategy:
      matrix:
        api-gateway:         { SERVICE: api-gateway }
        auth-service:        { SERVICE: auth-service }
        account-service:     { SERVICE: account-service }
        transaction-service: { SERVICE: transaction-service }
        payment-service:     { SERVICE: payment-service }
        loan-service:        { SERVICE: loan-service }
        card-service:        { SERVICE: card-service }
        kyc-service:         { SERVICE: kyc-service }
        notification-service:{ SERVICE: notification-service }
        statement-service:   { SERVICE: statement-service }
        audit-service:       { SERVICE: audit-service }
      maxParallel: 6

    steps:
    - task: Cache@2
      displayName: 'Cache Maven repository'
      inputs:
        key: 'maven | "$(Agent.OS)" | **/pom.xml'
        restoreKeys: 'maven | "$(Agent.OS)"'
        path: $(MAVEN_CACHE_FOLDER)

    - script: |
        mvn -pl services/$(SERVICE) -am clean verify \
          --no-transfer-progress \
          -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)
      displayName: 'mvn verify — $(SERVICE)'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'services/$(SERVICE)/target/surefire-reports/*.xml'
        testRunTitle: '$(SERVICE) — Unit Tests'
        mergeTestResults: true

  # ── React / TypeScript frontend ──────────────────────────────────────────
  - job: BuildTestFrontend
    displayName: 'Build & Test — Frontend'
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: NodeTool@0
      displayName: 'Use Node $(NODE_VERSION)'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - task: Cache@2
      displayName: 'Cache npm'
      inputs:
        key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
        restoreKeys: 'npm | "$(Agent.OS)"'
        path: $(npm_config_cache)

    - script: npm ci
      workingDirectory: frontend
      displayName: 'npm ci'

    - script: npx tsc --noEmit
      workingDirectory: frontend
      displayName: 'TypeScript type-check'

    - script: npm test -- --run || echo "No test runner configured — skipping"
      workingDirectory: frontend
      displayName: 'Run tests'

    - script: npm run build
      workingDirectory: frontend
      displayName: 'Build production bundle'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish frontend dist'
      inputs:
        PathtoPublish: 'frontend/dist'
        ArtifactName: 'frontend-dist'
        publishLocation: Container

# ════════════════════════════════════════════════════════════════════════════
# Stage 2 — Security Scan (Trivy filesystem)
# ════════════════════════════════════════════════════════════════════════════
- stage: SecurityScan
  displayName: '2 · Security Scan'
  dependsOn: CI_Build
  condition: succeeded()
  jobs:

  - job: TrivyScan
    displayName: 'Trivy — $(SERVICE)'
    pool:
      vmImage: ubuntu-latest
    strategy:
      matrix:
        api-gateway:         { SERVICE: api-gateway }
        auth-service:        { SERVICE: auth-service }
        account-service:     { SERVICE: account-service }
        transaction-service: { SERVICE: transaction-service }
        payment-service:     { SERVICE: payment-service }
        loan-service:        { SERVICE: loan-service }
        card-service:        { SERVICE: card-service }
        kyc-service:         { SERVICE: kyc-service }
        notification-service:{ SERVICE: notification-service }
        statement-service:   { SERVICE: statement-service }
        audit-service:       { SERVICE: audit-service }
      maxParallel: 6

    steps:
    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin
      displayName: 'Install Trivy'

    - script: |
        trivy fs \
          --severity CRITICAL,HIGH \
          --exit-code 0 \
          --format sarif \
          --output "trivy-$(SERVICE).sarif" \
          services/$(SERVICE)
      displayName: 'Trivy scan — $(SERVICE)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish SARIF report'
      condition: always()
      inputs:
        PathtoPublish: 'trivy-$(SERVICE).sarif'
        ArtifactName: 'security-reports'
        publishLocation: Container

  # ── Optional: SonarQube (activate by setting SONAR_TOKEN in variable group) ─
  - job: SonarQube
    displayName: 'SonarQube Analysis'
    pool:
      vmImage: ubuntu-latest
    condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''))
    variables:
      SONAR_TOKEN: $(SONAR_TOKEN)

    steps:
    - task: Cache@2
      displayName: 'Cache Maven repository'
      inputs:
        key: 'maven | "$(Agent.OS)" | **/pom.xml'
        restoreKeys: 'maven | "$(Agent.OS)"'
        path: $(MAVEN_CACHE_FOLDER)

    - script: |
        mvn clean verify -Pcoverage \
          --no-transfer-progress \
          -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)
      displayName: 'Build with coverage'

    - script: |
        mvn sonar:sonar \
          --no-transfer-progress \
          -Dsonar.projectKey=zingybank \
          -Dsonar.host.url=$(SONAR_HOST_URL) \
          -Dsonar.token=$(SONAR_TOKEN) \
          -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)
      displayName: 'SonarQube analysis'

# ════════════════════════════════════════════════════════════════════════════
# Stage 3 — Docker Build & Push to ACR
# Only runs on direct pushes to dev / staging / main (not PRs)
# ════════════════════════════════════════════════════════════════════════════
- stage: DockerBuildPush
  displayName: '3 · Docker Build & Push'
  dependsOn: SecurityScan
  condition: |
    and(
      succeeded(),
      ne(variables['Build.Reason'], 'PullRequest'),
      in(variables['Build.SourceBranch'],
         'refs/heads/main', 'refs/heads/staging', 'refs/heads/dev')
    )
  jobs:

  # ── Microservices ─────────────────────────────────────────────────────────
  - job: BuildPushServices
    displayName: 'Push — $(SERVICE)'
    pool:
      vmImage: ubuntu-latest
    strategy:
      matrix:
        api-gateway:         { SERVICE: api-gateway }
        auth-service:        { SERVICE: auth-service }
        account-service:     { SERVICE: account-service }
        transaction-service: { SERVICE: transaction-service }
        payment-service:     { SERVICE: payment-service }
        loan-service:        { SERVICE: loan-service }
        card-service:        { SERVICE: card-service }
        kyc-service:         { SERVICE: kyc-service }
        notification-service:{ SERVICE: notification-service }
        statement-service:   { SERVICE: statement-service }
        audit-service:       { SERVICE: audit-service }
      maxParallel: 6

    steps:
    - script: |
        SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
        BRANCH="$(Build.SourceBranchName)"
        echo "##vso[task.setvariable variable=ImageTag]${BRANCH}-${SHA}"
        echo "##vso[task.setvariable variable=BranchName]${BRANCH}"
        echo "Image tag: ${BRANCH}-${SHA}"
      displayName: 'Compute image tag'

    - task: Docker@2
      displayName: 'Build & push $(SERVICE) → ACR'
      inputs:
        containerRegistry: 'azure-acr-service-connection'
        repository: 'zingybank/$(SERVICE)'
        command: buildAndPush
        Dockerfile: 'services/$(SERVICE)/Dockerfile'
        buildContext: '.'
        tags: |
          $(ImageTag)
          $(BranchName)-latest

  # ── Frontend ─────────────────────────────────────────────────────────────
  - job: BuildPushFrontend
    displayName: 'Push — Frontend'
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download frontend dist'
      inputs:
        buildType: current
        artifactName: 'frontend-dist'
        downloadPath: 'frontend/dist'

    - script: |
        SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
        BRANCH="$(Build.SourceBranchName)"
        echo "##vso[task.setvariable variable=ImageTag]${BRANCH}-${SHA}"
        echo "##vso[task.setvariable variable=BranchName]${BRANCH}"
        echo "Image tag: ${BRANCH}-${SHA}"
      displayName: 'Compute image tag'

    - task: Docker@2
      displayName: 'Build & push frontend → ACR'
      inputs:
        containerRegistry: 'azure-acr-service-connection'
        repository: 'zingybank/frontend'
        command: buildAndPush
        Dockerfile: 'frontend/Dockerfile'
        buildContext: 'frontend'
        tags: |
          $(ImageTag)
          $(BranchName)-latest

# ════════════════════════════════════════════════════════════════════════════
# Stage 4 — Deploy to Dev  (automatic — dev branch only)
# No approval gate. Every commit to dev auto-deploys.
# ════════════════════════════════════════════════════════════════════════════
- stage: DeployDev
  displayName: '4 · Deploy → Dev'
  dependsOn: DockerBuildPush
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/dev')
    )
  variables:
  - group: zingybank-dev-vars   # AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME

  jobs:
  - deployment: DeployDev
    displayName: 'Deploy to zingybank-dev'
    pool:
      vmImage: ubuntu-latest
    environment: 'zingybank-dev'     # Auto — no approval check needed
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true

          - task: AzureCLI@2
            displayName: 'Get AKS credentials (dev)'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(AKS_RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER_NAME) \
                  --overwrite-existing

          - script: |
              SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
              TAG="dev-${SHA}"
              echo "Updating Helm values for dev → tag: ${TAG}"
              for service in api-gateway auth-service account-service transaction-service \
                             payment-service loan-service card-service kyc-service \
                             notification-service statement-service audit-service; do
                FILE="infrastructure/helm/values/dev/${service}.yaml"
                [ -f "$FILE" ] && sed -i "s/tag: .*/tag: \"${TAG}\"/" "$FILE"
              done
              git config user.email "azure-pipelines[bot]@dev.azure.com"
              git config user.name "azure-pipelines[bot]"
              git add infrastructure/helm/values/dev/
              git diff --cached --quiet || \
                git commit -m "chore(cd): deploy dev-${SHA} to dev [skip ci]"
              git push origin HEAD:dev
            displayName: 'Update Helm values — dev'

          - script: |
              echo "ArgoCD will auto-sync and deploy to the zingybank namespace (dev)"
              echo "Monitor: kubectl get pods -n zingybank"
              echo "Logs:    kubectl logs -n zingybank -l app.kubernetes.io/managed-by=Helm --tail=50"
            displayName: 'Deployment summary'

# ════════════════════════════════════════════════════════════════════════════
# Stage 5 — Deploy to Staging  (automatic — staging or main branch)
# Optionally add an Approvals check to zingybank-staging for extra governance.
# ════════════════════════════════════════════════════════════════════════════
- stage: DeployStaging
  displayName: '5 · Deploy → Staging'
  dependsOn: DockerBuildPush
  condition: |
    and(
      succeeded(),
      in(variables['Build.SourceBranch'],
         'refs/heads/staging', 'refs/heads/main')
    )
  variables:
  - group: zingybank-staging-vars   # AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME

  jobs:
  - deployment: DeployStaging
    displayName: 'Deploy to zingybank-staging'
    pool:
      vmImage: ubuntu-latest
    environment: 'zingybank-staging'   # Add approval check here for staging gate
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true

          - task: AzureCLI@2
            displayName: 'Get AKS credentials (staging)'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(AKS_RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER_NAME) \
                  --overwrite-existing

          - script: |
              SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
              BRANCH="$(Build.SourceBranchName)"
              TAG="${BRANCH}-${SHA}"
              echo "Updating Helm values for staging → tag: ${TAG}"
              for service in api-gateway auth-service account-service transaction-service \
                             payment-service loan-service card-service kyc-service \
                             notification-service statement-service audit-service; do
                FILE="infrastructure/helm/values/staging/${service}.yaml"
                [ -f "$FILE" ] && sed -i "s/tag: .*/tag: \"${TAG}\"/" "$FILE"
              done
              git config user.email "azure-pipelines[bot]@dev.azure.com"
              git config user.name "azure-pipelines[bot]"
              git add infrastructure/helm/values/staging/
              git diff --cached --quiet || \
                git commit -m "chore(cd): deploy ${TAG} to staging [skip ci]"
              git push origin HEAD
            displayName: 'Update Helm values — staging'

          - task: AzureCLI@2
            displayName: 'Smoke test — staging health'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Waiting 60s for ArgoCD sync..."
                sleep 60
                INGRESS_IP=$(kubectl get svc -n zingybank-ingress \
                  ingress-nginx-controller \
                  -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
                if [ "$INGRESS_IP" != "pending" ] && [ -n "$INGRESS_IP" ]; then
                  HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" \
                    "http://${INGRESS_IP}/api/actuator/health" --max-time 10)
                  if [ "$HTTP_CODE" = "200" ]; then
                    echo "✅ Staging health check passed (HTTP ${HTTP_CODE})"
                  else
                    echo "⚠️  Health check returned HTTP ${HTTP_CODE} — verify ArgoCD sync"
                  fi
                else
                  echo "ℹ️  Ingress IP not yet available — ArgoCD completing sync"
                fi

# ════════════════════════════════════════════════════════════════════════════
# Stage 6 — Deploy to Production  ⛩  MANUAL APPROVAL REQUIRED
#
# Gate is enforced by the zingybank-production Environment in Azure DevOps.
# Only runs when a commit is pushed to main AND staging deploy succeeded.
#
# To configure the approval gate:
#   Pipelines → Environments → zingybank-production
#   → Approvals & Checks → + → Approvals
#   → Add approvers (e.g., Tech Lead, Engineering Manager)
#   → Instructions: "Verify staging smoke tests and change advisory before approving"
#   → Timeout: 1 day   → Notify on pending: enabled
# ════════════════════════════════════════════════════════════════════════════
- stage: DeployProduction
  displayName: '6 · Deploy → Production  ⛩ APPROVAL REQUIRED'
  dependsOn: DeployStaging
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  variables:
  - group: zingybank-prod-vars   # AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME

  jobs:
  - deployment: DeployProduction
    displayName: 'Deploy to zingybank-production'
    pool:
      vmImage: ubuntu-latest
    # ⛩  Approval gate enforced here — pipeline pauses until approved
    environment: 'zingybank-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true

          - task: AzureCLI@2
            displayName: 'Get AKS credentials (prod)'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(AKS_RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER_NAME) \
                  --overwrite-existing

          - script: |
              SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
              TAG="main-${SHA}"
              RELEASE="v1.0.$(Build.BuildId)"
              echo "Updating Helm values for production → tag: ${TAG} (release ${RELEASE})"
              for service in api-gateway auth-service account-service transaction-service \
                             payment-service loan-service card-service kyc-service \
                             notification-service statement-service audit-service; do
                FILE="infrastructure/helm/values/prod/${service}.yaml"
                [ -f "$FILE" ] && sed -i "s/tag: .*/tag: \"${TAG}\"/" "$FILE"
              done
              git config user.email "azure-pipelines[bot]@dev.azure.com"
              git config user.name "azure-pipelines[bot]"
              git add infrastructure/helm/values/prod/
              git diff --cached --quiet || \
                git commit -m "chore(cd): deploy ${TAG} to production [skip ci]"
              git push origin HEAD:main
            displayName: 'Update Helm values — production'

          - task: AzureCLI@2
            displayName: 'Tag release images in ACR'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
                SOURCE_TAG="main-${SHA}"
                RELEASE_TAG="v1.0.$(Build.BuildId)"
                az acr login --name zingybank
                for service in api-gateway auth-service account-service transaction-service \
                               payment-service loan-service card-service kyc-service \
                               notification-service statement-service audit-service frontend; do
                  echo "Tagging ${service}:${SOURCE_TAG} → ${RELEASE_TAG}"
                  az acr import \
                    --name zingybank \
                    --source "$(REGISTRY_ACR)/zingybank/${service}:${SOURCE_TAG}" \
                    --image "zingybank/${service}:${RELEASE_TAG}" \
                    --force 2>/dev/null || \
                  echo "⚠️ az acr import not available — image tag via Docker CLI" && \
                  docker pull "$(REGISTRY_ACR)/zingybank/${service}:${SOURCE_TAG}" && \
                  docker tag  "$(REGISTRY_ACR)/zingybank/${service}:${SOURCE_TAG}" \
                              "$(REGISTRY_ACR)/zingybank/${service}:${RELEASE_TAG}" && \
                  docker push "$(REGISTRY_ACR)/zingybank/${service}:${RELEASE_TAG}" || true
                done
                echo "✅ Release tagged: ${RELEASE_TAG}"

          - task: AzureCLI@2
            displayName: 'Production smoke test'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Waiting 90s for ArgoCD sync..."
                sleep 90
                INGRESS_IP=$(kubectl get svc -n zingybank-ingress \
                  ingress-nginx-controller \
                  -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
                if [ "$INGRESS_IP" != "pending" ] && [ -n "$INGRESS_IP" ]; then
                  for endpoint in \
                    "http://${INGRESS_IP}/api/actuator/health" \
                    "http://${INGRESS_IP}/api/v1/auth/health"; do
                    HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" \
                      "$endpoint" --max-time 15)
                    echo "${endpoint} → HTTP ${HTTP_CODE}"
                  done
                else
                  echo "ℹ️  Ingress IP not yet assigned — ArgoCD completing sync"
                fi

          - script: |
              SHA=$(echo "$(Build.SourceVersion)" | cut -c1-7)
              echo "════════════════════════════════════════════════════════"
              echo "  ZingyBank Production Release Complete"
              echo "════════════════════════════════════════════════════════"
              echo "  Release   : v1.0.$(Build.BuildId)"
              echo "  Commit    : $(Build.SourceVersion)"
              echo "  Image tag : main-${SHA}"
              echo "  Pipeline  : CI → Security → Docker → Staging ✓ → Production ✓"
              echo "  Services  : 11 microservices + frontend"
              echo "════════════════════════════════════════════════════════"
              echo "  Grafana   : https://grafana.zingybank.example.com"
              echo "  Jaeger    : https://jaeger.zingybank.example.com"
              echo "  ArgoCD    : kubectl port-forward svc/argocd-server -n argocd 8080:443"
              echo "════════════════════════════════════════════════════════"
            displayName: 'Release summary'
