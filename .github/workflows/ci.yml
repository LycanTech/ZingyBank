name: ZingyBank CI Pipeline

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

env:
  JAVA_VERSION: '21'
  # GHCR is always available — no additional secrets required
  REGISTRY_GHCR: ghcr.io
  # Optional registries — only used when the corresponding secrets are configured
  REGISTRY_ACR: zingybank.azurecr.io
  # Dev environment ACR — used on dev branch when AZURE_CREDENTIALS is configured
  REGISTRY_ACR_DEV: zingybankdev.azurecr.io

permissions:
  contents: read
  packages: write        # Required for GHCR push
  security-events: write # Required for SARIF upload

jobs:
  # ============================================================
  # Stage 1: Build & Test (Java microservices)
  # ============================================================
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - account-service
          - transaction-service
          - payment-service
          - loan-service
          - card-service
          - kyc-service
          - notification-service
          - statement-service
          - audit-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & Test ${{ matrix.service }}
        run: mvn -pl services/${{ matrix.service }} -am clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/

  # ============================================================
  # Stage 1b: Frontend Build & Test
  # ============================================================
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check 2>/dev/null || npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run 2>/dev/null || echo "No test runner configured, skipping"

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ============================================================
  # Stage 2: Code Quality (SonarQube — optional)
  # Runs only when SONAR_TOKEN secret is configured
  # ============================================================
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend-build]
    if: github.event_name == 'push'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check SonarQube config
        id: sonar-check
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "SONAR_TOKEN not configured — skipping SonarQube analysis"
          fi

      - name: Checkout code
        if: steps.sonar-check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: steps.sonar-check.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build with coverage
        if: steps.sonar-check.outputs.enabled == 'true'
        run: mvn clean verify -Pcoverage

      - name: SonarQube Analysis
        if: steps.sonar-check.outputs.enabled == 'true'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=zingybank \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN

  # ============================================================
  # Stage 3: Security Scanning (Trivy)
  # ============================================================
  security-scan:
    name: Security Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service:
          - api-gateway
          - auth-service
          - account-service
          - transaction-service
          - payment-service
          - loan-service
          - card-service
          - kyc-service
          - notification-service
          - statement-service
          - audit-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          scan-type: fs
          scan-ref: services/${{ matrix.service }}
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results
        if: always() && hashFiles(format('trivy-results-{0}.sarif', matrix.service)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ============================================================
  # Stage 4: Build & Push Docker Images (microservices)
  #
  # Primary:  GitHub Container Registry  — always (uses GITHUB_TOKEN)
  # Optional: Azure ACR                  — set secrets: ACR_USERNAME, ACR_PASSWORD
  # Optional: AWS ECR                    — set secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ACCOUNT_ID
  # Optional: GCP Artifact Registry      — set secrets: GCP_SA_KEY, GCP_PROJECT_ID
  # ============================================================
  docker-build-push:
    name: Push Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - account-service
          - transaction-service
          - payment-service
          - loan-service
          - card-service
          - kyc-service
          - notification-service
          - statement-service
          - audit-service
    # Expose optional secrets as env vars so they can be checked in if: conditions
    env:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH=${GITHUB_REF##*/}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "sha_short=$SHA_SHORT"       >> $GITHUB_OUTPUT
          echo "branch=$BRANCH"             >> $GITHUB_OUTPUT
          echo "tag=${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "owner=$OWNER"               >> $GITHUB_OUTPUT

      # ── Primary: GHCR (always — uses GITHUB_TOKEN, zero config required) ──
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.branch }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Optional: Azure ACR ──────────────────────────────────────────────────
      - name: Login to Azure Container Registry
        if: env.ACR_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push to Azure ACR
        if: env.ACR_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_ACR }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY_ACR }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.branch }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Optional: AWS ECR ────────────────────────────────────────────────────
      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to AWS ECR
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Push to AWS ECR
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.branch }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Optional: GCP Artifact Registry ─────────────────────────────────────
      - name: Login to GCP Artifact Registry
        if: env.GCP_SA_KEY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Push to GCP Artifact Registry
        if: env.GCP_SA_KEY != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.branch }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Stage 4b: Build & Push Frontend Docker Image
  # ============================================================
  frontend-docker-push:
    name: Push Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-build, build-and-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    env:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH=${GITHUB_REF##*/}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "sha_short=$SHA_SHORT"       >> $GITHUB_OUTPUT
          echo "branch=$BRANCH"             >> $GITHUB_OUTPUT
          echo "tag=${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "owner=$OWNER"               >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend to GHCR
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/zingybank/frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/zingybank/frontend:${{ steps.meta.outputs.branch }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Azure ACR (optional)
        if: env.ACR_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push frontend to ACR (optional)
        if: env.ACR_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_ACR }}/zingybank/frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY_ACR }}/zingybank/frontend:${{ steps.meta.outputs.branch }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Stage 5: Deploy to Dev AKS (dev branch only)
  #
  # Requires GitHub secret: AZURE_CREDENTIALS (service principal JSON)
  # with AcrPush on zingybankdev ACR + AKS admin on zingybank-aks-dev.
  # Skipped gracefully if the secret is not configured.
  # ============================================================
  deploy-dev:
    name: Deploy to Dev AKS
    runs-on: ubuntu-latest
    needs: [docker-build-push, frontend-docker-push]
    if: github.ref == 'refs/heads/dev'
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Check Azure credentials
        id: az-check
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "AZURE_CREDENTIALS not configured — skipping dev AKS deploy"
          fi

      - name: Azure login
        if: steps.az-check.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Dev ACR
        if: steps.az-check.outputs.enabled == 'true'
        run: az acr login --name zingybankdev

      - name: Checkout code
        if: steps.az-check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.az-check.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push all services to Dev ACR
        if: steps.az-check.outputs.enabled == 'true'
        run: |
          for svc in api-gateway auth-service account-service transaction-service \
                     payment-service loan-service card-service kyc-service \
                     notification-service statement-service audit-service; do
            echo "Building $svc..."
            docker build \
              --file services/$svc/Dockerfile \
              --tag ${{ env.REGISTRY_ACR_DEV }}/zingybank/$svc:dev-latest \
              --push \
              .
          done

      - name: Build and push frontend to Dev ACR
        if: steps.az-check.outputs.enabled == 'true'
        run: |
          docker build \
            --file frontend/Dockerfile \
            --tag ${{ env.REGISTRY_ACR_DEV }}/zingybank/frontend:dev-latest \
            --push \
            frontend/

      - name: Get AKS dev credentials
        if: steps.az-check.outputs.enabled == 'true'
        run: |
          az aks get-credentials \
            --resource-group zingybank-dev-rg \
            --name zingybank-aks-dev \
            --overwrite-existing

      - name: Rolling restart all dev deployments
        if: steps.az-check.outputs.enabled == 'true'
        run: |
          kubectl rollout restart deployment -n zingybank-dev
          kubectl rollout status deployment -n zingybank-dev --timeout=300s

      - name: Smoke test — registration endpoint
        if: steps.az-check.outputs.enabled == 'true'
        run: |
          INGRESS_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Ingress IP: $INGRESS_IP"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 15 \
            -X POST http://$INGRESS_IP/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"firstName":"CI","lastName":"Bot","email":"cibot@zingybank.com","password":"CI@Bot2026!","phoneNumber":"+2340000000001"}')
          echo "Registration status: $STATUS"
          # 200 = success, 409 = already registered (both acceptable in CI)
          [[ "$STATUS" == "200" || "$STATUS" == "409" ]] && echo "Smoke test passed" || exit 1
