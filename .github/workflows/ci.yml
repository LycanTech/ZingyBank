name: ZingyBank CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  REGISTRY_AZURE: zingybank.azurecr.io
  REGISTRY_AWS: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ============================================================
  # Stage 1: Build & Test
  # ============================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - account-service
          - transaction-service
          - payment-service
          - loan-service
          - card-service
          - kyc-service
          - notification-service
          - statement-service
          - audit-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & Test ${{ matrix.service }}
        run: mvn -pl services/${{ matrix.service }} -am clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/

  # ============================================================
  # Stage 2: Code Quality (SonarQube)
  # ============================================================
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build with coverage
        run: mvn clean verify -Pcoverage

      - name: SonarQube Analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=zingybank \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN

  # ============================================================
  # Stage 3: Security Scanning
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - account-service
          - transaction-service
          - payment-service
          - loan-service
          - card-service
          - kyc-service
          - notification-service
          - statement-service
          - audit-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build Docker image
        run: docker build -t zingybank/${{ matrix.service }}:scan -f services/${{ matrix.service }}/Dockerfile .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: zingybank/${{ matrix.service }}:scan
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif

  # ============================================================
  # Stage 4: Build & Push Docker Images
  # ============================================================
  docker-build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - account-service
          - transaction-service
          - payment-service
          - loan-service
          - card-service
          - kyc-service
          - notification-service
          - statement-service
          - audit-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY_AZURE }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to AWS ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH=${GITHUB_REF##*/}
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "tag=${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Build and push to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_AZURE }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY_AZURE }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.branch }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_AWS }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY_AWS }}/zingybank/${{ matrix.service }}:${{ steps.meta.outputs.branch }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
