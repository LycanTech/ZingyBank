name: ZingyBank CD Pipeline

on:
  workflow_run:
    workflows: ["ZingyBank CI Pipeline"]
    types:
      - completed
    branches: [main]

# Grant GITHUB_TOKEN write access to push Helm value updates back to the repo
permissions:
  contents: write

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: meta
        run: echo "sha_short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Update Helm values for staging
        run: |
          for service in api-gateway auth-service account-service transaction-service payment-service loan-service card-service kyc-service notification-service statement-service audit-service; do
            FILE="infrastructure/helm/values/staging/${service}.yaml"
            if [ -f "$FILE" ]; then
              sed -i "s/tag: .*/tag: \"main-${{ steps.meta.outputs.sha_short }}\"/" "$FILE"
            fi
          done

      - name: Commit and push updated image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/helm/values/staging/
          git commit -m "chore(cd): deploy main-${{ steps.meta.outputs.sha_short }} to staging [skip ci]" || echo "No changes to commit"
          git push

      - name: ArgoCD auto-sync notification
        run: |
          echo "ArgoCD will detect the git push and auto-sync staging namespace"
          echo "Monitor at: https://argocd.zingybank.internal"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production  # Requires manual approval in GitHub Environments settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Get short SHA
        id: meta
        run: echo "sha_short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Update Helm values for production
        run: |
          for service in api-gateway auth-service account-service transaction-service payment-service loan-service card-service kyc-service notification-service statement-service audit-service; do
            FILE="infrastructure/helm/values/prod/${service}.yaml"
            if [ -f "$FILE" ]; then
              sed -i "s/tag: .*/tag: \"main-${{ steps.meta.outputs.sha_short }}\"/" "$FILE"
            fi
          done

      - name: Commit and push updated image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/helm/values/prod/
          git commit -m "chore(cd): deploy main-${{ steps.meta.outputs.sha_short }} to production [skip ci]" || echo "No changes to commit"
          git push

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          release_name: Release v1.0.${{ github.run_number }}
          body: |
            ## ZingyBank Production Release
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Image tag: main-${{ steps.meta.outputs.sha_short }}
            - Services: all 11 microservices updated
            - Pipeline: CI → Staging → Production (manual gate)
          draft: false
          prerelease: false
