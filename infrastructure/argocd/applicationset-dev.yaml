apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: zingybank-dev
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: frontend
            port: "3000"
          - service: api-gateway
            port: "8080"
          - service: auth-service
            port: "8081"
          - service: account-service
            port: "8082"
          - service: transaction-service
            port: "8083"
          - service: payment-service
            port: "8084"
          - service: loan-service
            port: "8085"
          - service: card-service
            port: "8086"
          - service: kyc-service
            port: "8087"
          - service: notification-service
            port: "8088"
          - service: statement-service
            port: "8089"
          - service: audit-service
            port: "8090"
  template:
    metadata:
      name: "zingybank-dev-{{service}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/LycanTech/ZingyBank.git
        targetRevision: dev
        path: infrastructure/helm/charts/base-service
        helm:
          valueFiles:
            - ../../values/dev/{{service}}.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: zingybank-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
