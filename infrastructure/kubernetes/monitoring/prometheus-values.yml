# Prometheus + Grafana stack values for ZingyBank
# Install: helm install monitoring prometheus-community/kube-prometheus-stack -n zingybank-monitoring -f prometheus-values.yml

prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Scrape ZingyBank services
    additionalScrapeConfigs:
      - job_name: zingybank-services
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - zingybank
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: $2:$1

grafana:
  enabled: true
  adminPassword: "zingybank-grafana-admin" # Override in production via secrets
  persistence:
    enabled: true
    size: 10Gi

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: zingybank
          orgId: 1
          folder: ZingyBank
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/zingybank

  dashboards:
    zingybank:
      zingybank-overview:
        json: |
          {
            "title": "ZingyBank Overview",
            "uid": "zingybank-overview",
            "panels": [
              {
                "title": "Transactions Per Second",
                "type": "timeseries",
                "targets": [
                  {
                    "expr": "rate(http_server_requests_seconds_count{namespace=\"zingybank\", uri=~\"/api/v1/transactions.*\"}[5m])",
                    "legendFormat": "{{pod}}"
                  }
                ],
                "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
              },
              {
                "title": "API Latency (p99)",
                "type": "timeseries",
                "targets": [
                  {
                    "expr": "histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{namespace=\"zingybank\"}[5m]))",
                    "legendFormat": "{{service}}"
                  }
                ],
                "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
              },
              {
                "title": "Error Rate (5xx)",
                "type": "stat",
                "targets": [
                  {
                    "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"zingybank\", status=~\"5..\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"zingybank\"}[5m])) * 100",
                    "legendFormat": "Error %"
                  }
                ],
                "gridPos": {"h": 4, "w": 6, "x": 0, "y": 8}
              },
              {
                "title": "Active Pods",
                "type": "stat",
                "targets": [
                  {
                    "expr": "count(kube_pod_status_ready{namespace=\"zingybank\", condition=\"true\"})",
                    "legendFormat": "Ready Pods"
                  }
                ],
                "gridPos": {"h": 4, "w": 6, "x": 6, "y": 8}
              }
            ]
          }

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'zingybank-alerts'
    receivers:
      - name: 'zingybank-alerts'
        # Configure Slack/PagerDuty in production:
        # slack_configs:
        #   - api_url: 'https://hooks.slack.com/services/...'
        #     channel: '#zingybank-alerts'
