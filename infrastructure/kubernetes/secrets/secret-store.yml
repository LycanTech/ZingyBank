# External Secrets Operator - ClusterSecretStore backed by HashiCorp Vault
# Prerequisites:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
#
# Create the Vault token secret first:
#   kubectl create secret generic vault-token --from-literal=token=<VAULT_TOKEN> -n zingybank

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: zingybank
          key: token
