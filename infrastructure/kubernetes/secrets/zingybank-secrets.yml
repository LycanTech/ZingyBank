# External Secrets - syncs secrets from Vault into Kubernetes Secrets
# Vault secrets must be seeded first using:
#   infrastructure/kubernetes/secrets/vault-init.sh

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zingybank-database-secret
  namespace: zingybank
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zingybank-database-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: secret/zingybank/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/zingybank/database
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zingybank-jwt-secret
  namespace: zingybank
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zingybank-jwt-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/zingybank/jwt
        property: secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zingybank-redis-secret
  namespace: zingybank
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zingybank-redis-secret
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: secret/zingybank/redis
        property: password
