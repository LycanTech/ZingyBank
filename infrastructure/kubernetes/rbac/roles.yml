# ZingyBank Kubernetes RBAC
# Principle of least privilege — each role gets only what it needs
# Mirrors application roles: CUSTOMER, TELLER, MANAGER, COMPLIANCE_OFFICER, ADMIN

---
# ─── ClusterRoles ─────────────────────────────────────────────────────────────

# Read-only view of all ZingyBank resources (used by monitoring tools)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zingybank-viewer
  labels:
    app.kubernetes.io/part-of: zingybank
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]

---
# Developer role — can view logs and exec into pods (non-prod only)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zingybank-developer
  namespace: zingybank
  labels:
    app.kubernetes.io/part-of: zingybank
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]

---
# Operator role — can manage deployments (scale, rollout restart)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zingybank-operator
  namespace: zingybank
  labels:
    app.kubernetes.io/part-of: zingybank
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "update", "patch"]

---
# CI/CD role — used by GitHub Actions / ArgoCD to deploy
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zingybank-cicd
  namespace: zingybank
  labels:
    app.kubernetes.io/part-of: zingybank
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# Monitoring role — used by Prometheus for service discovery
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zingybank-monitoring
  labels:
    app.kubernetes.io/part-of: zingybank
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/actuator/prometheus"]
    verbs: ["get"]
