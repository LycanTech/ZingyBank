global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          application: api-gateway

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']
        labels:
          application: auth-service

  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['account-service:8082']
        labels:
          application: account-service

  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['transaction-service:8083']
        labels:
          application: transaction-service

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-service:8084']
        labels:
          application: payment-service

  - job_name: loan-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['loan-service:8085']
        labels:
          application: loan-service

  - job_name: card-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['card-service:8086']
        labels:
          application: card-service

  - job_name: kyc-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['kyc-service:8087']
        labels:
          application: kyc-service

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8088']
        labels:
          application: notification-service

  - job_name: statement-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['statement-service:8089']
        labels:
          application: statement-service

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['audit-service:8090']
        labels:
          application: audit-service
