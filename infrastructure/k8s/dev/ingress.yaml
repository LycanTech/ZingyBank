apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zingybank-dev-ingress
  namespace: zingybank-dev
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: zingybank-dev-api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zingybank-dev-frontend
                port:
                  number: 3000
