# ExternalName services so the api-gateway can resolve short names
# (api-gateway.yml routes to http://auth-service:8081 etc.)
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: zingybank-dev
spec:
  type: ExternalName
  externalName: zingybank-dev-auth-service.zingybank-dev.svc.cluster.local
---
