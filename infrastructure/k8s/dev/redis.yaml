apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: zingybank-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        nodepool-type: application
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: zingybank-dev
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
