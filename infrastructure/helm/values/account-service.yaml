image:
  repository: zingybank.azurecr.io/zingybank/account-service
  tag: "latest"
service:
  port: 8082
env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://pgbouncer:5432/zingybank_account
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_SERVICE_NAME: account-service
  VAULT_ADDR: http://vault:8200
secrets:
  DB_USERNAME:
    secretName: zingybank-database-secret
    key: DB_USERNAME
  DB_PASSWORD:
    secretName: zingybank-database-secret
    key: DB_PASSWORD
